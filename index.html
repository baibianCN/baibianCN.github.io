<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 关键：禁止缩放，适配手机横屏 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>合金弹头2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }
        /* 16:9 游戏比例容器，自动铺满屏幕宽度 */
        .game-box {
            width: 100%;
            /* 16:9 比例换算 9÷16=56.25% */
            padding-bottom: 56.25%;
            position: relative;
            top: 50%;
            transform: translateY(-50%);
        }
        .game-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="game-box">
        <iframe src="https://classicjoy.games/embed?slug=metal-slug-2" allowfullscreen></iframe>
    </div>
</body>
</html>
